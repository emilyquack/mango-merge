<svg width="340" height="360" viewBox="0 0 340 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kiwi the Cat, a cute hint-giving cat mascot with a mint ribbon">
  <defs>
    <radialGradient id="fur" cx="45%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#F5E5C7"/>
      <stop offset="55%" stop-color="#C89058"/>
      <stop offset="100%" stop-color="#7E563B"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#DFF3A2"/>
      <stop offset="1" stop-color="#8EBE58"/>
    </radialGradient>
    <filter id="kittyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4B3628" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#kittyShadow)">
    <!-- tail -->
    <path d="M236 236 C304 214 308 284 255 291 C228 294 223 264 247 259 C264 255 270 274 253 278" fill="none" stroke="#7E563B" stroke-width="18" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="166" cy="242" rx="75" ry="78" fill="url(#fur)" stroke="#5F442F" stroke-width="6"/>
    <ellipse cx="166" cy="254" rx="45" ry="50" fill="url(#belly)" stroke="#6EA04E" stroke-width="4" opacity=".95"/>
    <!-- kiwi-seed belly spots -->
    <g fill="#4B3628" opacity=".55">
      <circle cx="147" cy="234" r="3"/><circle cx="182" cy="236" r="3"/><circle cx="137" cy="261" r="3"/>
      <circle cx="192" cy="263" r="3"/><circle cx="166" cy="279" r="3"/>
    </g>

    <!-- head with cat silhouette -->
    <path d="M80 139
             C68 87 86 63 116 98
             C133 83 160 76 187 82
             C201 86 214 93 225 103
             C254 64 274 88 258 142
             C274 197 232 232 170 232
             C104 232 64 195 80 139Z"
          fill="url(#fur)" stroke="#5F442F" stroke-width="6" stroke-linejoin="round"/>

    <!-- inner ears -->
    <path d="M91 111 C89 83 101 78 113 105 C106 105 98 107 91 111Z" fill="#FFD1DF" stroke="#CA8E94" stroke-width="3"/>
    <path d="M235 109 C249 82 259 86 249 115 C245 112 240 110 235 109Z" fill="#FFD1DF" stroke="#CA8E94" stroke-width="3"/>

    <!-- mint ribbon on ear -->
    <g transform="translate(243 91) rotate(-12)">
      <path d="M0 14 C-22 -7 -38 7 -32 27 C-18 27 -8 22 0 14Z" fill="#B8FFE9" stroke="#35B995" stroke-width="4"/>
      <path d="M10 14 C32 -8 47 8 39 28 C24 28 16 21 10 14Z" fill="#B8FFE9" stroke="#35B995" stroke-width="4"/>
      <circle cx="5" cy="15" r="10" fill="#62EBC8" stroke="#35B995" stroke-width="4"/>
      <path d="M-20 8 C-14 13 -10 18 -7 23" stroke="#EFFFF9" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- raised paw for tips -->
    <g class="tip-paw" transform-origin="84 228">
      <path d="M99 224 C67 198 51 176 56 155" fill="none" stroke="#C89058" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="53" cy="150" rx="18" ry="15" fill="#F5E5C7" stroke="#5F442F" stroke-width="5"/>
      <circle cx="45" cy="143" r="3.5" fill="#FFD1DF"/>
      <circle cx="54" cy="139" r="3.5" fill="#FFD1DF"/>
      <circle cx="63" cy="145" r="3.5" fill="#FFD1DF"/>
      <ellipse cx="54" cy="154" rx="6" ry="4" fill="#FFD1DF"/>
    </g>

    <!-- face -->
    <ellipse cx="134" cy="155" rx="15" ry="20" fill="#3A2A1E"/>
    <ellipse cx="201" cy="155" rx="15" ry="20" fill="#3A2A1E"/>
    <circle cx="129" cy="148" r="5" fill="#FFFDF4"/>
    <circle cx="196" cy="148" r="5" fill="#FFFDF4"/>
    <path d="M165 174 C158 168 171 168 165 174Z" fill="#FF9BB1" stroke="#74453E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M164 176 C157 190 144 187 140 178" fill="none" stroke="#3A2A1E" stroke-width="4" stroke-linecap="round"/>
    <path d="M166 176 C173 190 187 187 191 178" fill="none" stroke="#3A2A1E" stroke-width="4" stroke-linecap="round"/>

    <!-- whiskers -->
    <path d="M116 176 C94 171 82 168 65 169" stroke="#5F442F" stroke-width="3" stroke-linecap="round"/>
    <path d="M116 188 C93 190 80 195 67 202" stroke="#5F442F" stroke-width="3" stroke-linecap="round"/>
    <path d="M215 176 C238 171 251 168 268 169" stroke="#5F442F" stroke-width="3" stroke-linecap="round"/>
    <path d="M215 188 C239 190 252 195 265 202" stroke="#5F442F" stroke-width="3" stroke-linecap="round"/>

    <!-- blush -->
    <ellipse cx="111" cy="185" rx="17" ry="8" fill="#FFB4C4" opacity=".75"/>
    <ellipse cx="222" cy="185" rx="17" ry="8" fill="#FFB4C4" opacity=".75"/>

    <!-- feet -->
    <ellipse cx="128" cy="314" rx="25" ry="13" fill="#7E563B" opacity=".8"/>
    <ellipse cx="204" cy="314" rx="25" ry="13" fill="#7E563B" opacity=".8"/>
  </g>
</svg>
